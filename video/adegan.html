<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Adegan video Runut</title>
<style>
@font-face { font-family: "Jakarta"; font-weight: 400; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2"); }
@font-face { font-family: "Jakarta"; font-weight: 600; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2"); }
@font-face { font-family: "Jakarta"; font-weight: 800; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2"); }
@font-face { font-family: "Mono"; font-weight: 400; src: url("node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2"); }
:root { --latar: #0e1626; --kartu: #18243b; --kartu2: #21304c; --garis: #33456a; --teks: #f3f6fb; --redup: #9fb0cc; --kuning: #f7b733; --hijau: #34d399; --merah: #f87171; --biru: #60a5fa; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--latar); color: var(--teks); font-family: "Jakarta", "Segoe UI", sans-serif; }
#panggung { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 75% 15%, #1b2c4d 0%, transparent 70%), var(--latar); }
#isi { position: absolute; inset: 0; }
#bab { position: absolute; left: 60px; top: 44px; font-size: 26px; font-weight: 600; color: var(--kuning); letter-spacing: .5px; }
#merek { position: absolute; right: 60px; top: 40px; font-size: 30px; font-weight: 800; color: var(--teks); opacity: .85; }
#merek b { color: var(--kuning); }
#teks { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: 1640px; width: max-content; text-align: center; font-size: 33px; line-height: 1.3; font-weight: 600; background: rgba(6, 10, 20, .86); padding: 12px 28px; border-radius: 12px; }
#teks:empty { display: none; }
#tabir { position: absolute; inset: 0; background: #060a14; pointer-events: none; }
.a { position: absolute; }
.kartu { background: var(--kartu); border: 1.5px solid var(--garis); border-radius: 20px; padding: 26px 30px; }
.judul { font-size: 30px; font-weight: 800; }
.kecil { font-size: 24px; color: var(--redup); }
.id { font-family: "Mono", monospace; color: var(--biru); font-size: .86em; }
.av { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 32px; color: #0e1626; flex: none; }
.gel { background: var(--kartu2); border-radius: 18px; padding: 16px 22px; font-size: 27px; line-height: 1.35; }
.nama { font-size: 22px; font-weight: 700; color: var(--hijau); margin-bottom: 4px; }
.baris { display: flex; gap: 16px; align-items: flex-start; }
.pil { display: inline-block; padding: 12px 24px; border-radius: 999px; font-size: 30px; font-weight: 700; }
.merah { background: rgba(248, 113, 113, .16); border: 2px solid var(--merah); color: #fecaca; }
.hijau { background: rgba(52, 211, 153, .14); border: 2px solid var(--hijau); color: #bbf7d0; }
.kuning { background: rgba(247, 183, 51, .14); border: 2px solid var(--kuning); color: #fde9b5; }
.biru { background: rgba(96, 165, 250, .14); border: 2px solid var(--biru); color: #cfe3ff; }
.besar { font-size: 76px; font-weight: 800; line-height: 1.12; }
.sumber { font-size: 21px; color: var(--redup); }
.tengah { display: flex; align-items: center; justify-content: center; text-align: center; }
.jawab h4 { font-size: 27px; font-weight: 800; margin-bottom: 8px; }
.jawab p { font-size: 25px; line-height: 1.38; color: #dbe4f3; margin-bottom: 5px; }
table.izin { border-collapse: collapse; font-size: 22px; width: 100%; }
table.izin td { border: 1px solid var(--garis); padding: 7px 10px; font-family: "Mono", monospace; font-size: 20px; }
.token { position: absolute; width: 44px; height: 44px; border-radius: 10px; }
.tag { display: inline-block; font-size: 22px; font-weight: 700; padding: 7px 16px; border-radius: 999px; }
.batang { height: 44px; border-radius: 10px; }
#log { position: absolute; }
video { position: absolute; background: #000; }
</style>
</head>
<body>
<div id="panggung">
  <div id="isi"></div>
  <div id="bab"></div>
  <div id="merek">Run<b>ut</b></div>
  <div id="teks"></div>
  <div id="tabir"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="rekaman.js"></script>
<script>
// Satu adegan dimuat sekali, lalu LIHAT(t) menaruh semua animasi tepat pada detik t. Tidak ada jam berjalan, jadi hasil render selalu sama.
let garis = null, adegan = null;
const $ = (s) => document.querySelector(s);
const av = (huruf, warna, ukuran = 76) => `<div class="av" style="background:${warna};width:${ukuran}px;height:${ukuran}px;font-size:${ukuran * .42}px">${huruf}</div>`;
const WARNA = { A: "#60a5fa", D: "#f7b733", R: "#34d399", S: "#c084fc", H: "#f87171", T: "#f472b6" };

function alat(k) {
  const c = (i, geser = 0) => k[i].mulai + geser;
  // p: titik di dalam kalimat, 0 awal dan 1 akhir, supaya gambar tetap pas dengan ucapan.
  const p = (i, f = 0) => k[i].mulai + f * (k[i].selesai - k[i].mulai);
  const tl = gsap.timeline({ paused: true });
  const muncul = (s, at, v = {}) => tl.fromTo(s, { autoAlpha: 0, y: v.y ?? 28, x: v.x ?? 0, scale: v.s ?? 1 }, { autoAlpha: 1, y: 0, x: 0, scale: 1, duration: v.d ?? .6, ease: v.ease ?? "power3.out", stagger: v.st ?? 0 }, at);
  const hilang = (s, at, d = .3) => tl.to(s, { autoAlpha: 0, duration: d, ease: "power1.in" }, at);
  return { c, p, tl, muncul, hilang };
}

const ADEGAN = {
  hook(k) {
    const { c, p, tl, muncul } = alat(k);
    $("#merek").style.display = "none";
    const bot = `<div style="width:110px;height:110px;flex:none;border-radius:26px;background:var(--kartu2);border:3px solid var(--merah);display:flex;align-items:center;justify-content:center;gap:20px"><span style="width:18px;height:18px;border-radius:50%;background:var(--merah)"></span><span style="width:18px;height:18px;border-radius:50%;background:var(--merah)"></span></div>`;
    $("#isi").innerHTML = `
      <div class="a" id="tanyaGaji" style="right:150px;top:110px;background:var(--biru);color:#0e1626;border-radius:34px;padding:34px 60px;font-size:96px;font-weight:800;line-height:1.1">Berapa gaji Rina?</div>
      <div class="a baris" id="jawabGaji" style="left:150px;top:350px;align-items:center;gap:30px">${bot}<div class="gel" style="border:3px solid var(--merah);font-size:60px;font-weight:700;padding:30px 46px;display:flex;align-items:center;gap:26px">Gaji Rina Rp <span style="display:inline-block;width:360px;height:62px;background:var(--merah);border-radius:12px;filter:blur(7px)"></span></div></div>
      <div class="a tag merah" id="ilustrasi" style="left:150px;top:520px;font-size:28px">Ilustrasi, AI yang membaca semua data</div>
      <div class="a tengah" id="lain" style="left:60px;top:640px;width:1800px;gap:30px"><span class="pil merah" style="font-size:38px">Pembayaran pemasok yang ditahan</span><span class="pil merah" style="font-size:38px">Rencana rahasia direksi</span></div>`;
    tl.set("#jawabGaji, #ilustrasi, #lain .pil", { autoAlpha: 0 }, 0);
    muncul("#jawabGaji", c(1), { y: 30, d: .4 });
    muncul("#ilustrasi", p(1, .35), { y: 10 });
    muncul("#lain .pil", c(2), { st: 1.4, y: 30, ease: "back.out(1.6)" });
    return tl;
  },
  masalah(k) {
    const { c, p, tl, muncul, hilang } = alat(k);
    const kartu = (id, x, judul, isi) => `<div class="a kartu" id="${id}" style="left:${x}px;top:150px;width:570px;height:560px"><div style="font-size:40px;font-weight:800;margin-bottom:22px">${judul}</div><div class="isi">${isi}</div></div>`;
    $("#isi").innerHTML = `
      <div id="toko" class="a" style="inset:0">
        <div class="a kartu" id="hp" style="left:150px;top:190px;width:820px">
          <div class="kecil" style="margin-bottom:18px">Grup WhatsApp tim Sulawesi</div>
          <div class="baris">${av("R", WARNA.R)}<div class="gel" style="font-size:34px"><div class="nama">Rina Wulandari</div>Toko-toko di Makassar mulai tanya stok keripik.</div></div>
        </div>
        <div class="a tengah" id="andi" style="left:1150px;top:170px;width:620px;flex-direction:column;gap:20px">
          ${av("A", WARNA.A, 150)}
          <div style="font-size:48px;font-weight:800">Andi Saputra</div>
          <div class="kecil" style="font-size:32px">Staf penjualan</div>
        </div>
        <div class="a tengah" id="tanyaAndi" style="left:100px;top:600px;width:1720px;font-size:58px;font-weight:800;color:var(--kuning);text-align:center">Kenapa stoknya terlambat, dan apa yang belum selesai?</div>
      </div>
      <div id="tiga" class="a" style="inset:0">
      ${kartu("k1", 70, "Grup WhatsApp", `<div class="gel" style="font-size:34px"><div class="nama" style="font-size:26px">Dedi</div>Kapal tanggal 5 belum berangkat, slot penuh.</div>`)}
      ${kartu("k2", 675, "Dokumen pesanan", `<div style="font-size:48px;font-weight:700;text-decoration:line-through;color:var(--redup);margin-bottom:12px">1.200 karton</div><div style="font-size:64px;font-weight:800;margin-bottom:34px">900 karton</div><div class="pil kuning" style="font-size:32px">Alasan, kosong</div>`)}
      ${kartu("k3", 1280, "Daftar tugas", `<div class="gel" style="font-size:34px;margin-bottom:22px">Kapal untuk 300 karton sisanya</div><div class="pil merah" style="font-size:32px">Belum selesai</div>`)}
      </div>
      <div class="a tengah" id="kutip" style="left:200px;top:230px;width:1520px;flex-direction:column;gap:40px">
        <div class="baris" style="align-items:center">${av("D", WARNA.D, 130)}<div class="gel" style="font-size:54px;font-weight:700;padding:28px 44px">"Alasannya nanti aku jelasin di call ya."</div></div>
        <div class="pil merah" id="tak" style="font-size:44px">Andi tidak menemukan catatannya</div>
      </div>
      <div class="a" id="tanya3" style="left:0;top:170px;width:1920px;height:700px">
        <div class="a tengah" style="left:810px;top:270px;width:300px;flex-direction:column;gap:12px">${av("A", WARNA.A, 130)}<div style="font-size:36px;font-weight:800">Andi</div></div>
        ${[["D", "Dedi", 300, 40], ["R", "Rina", 300, 450], ["S", "Sari", 1420, 240]].map(([h, n, x, y]) => `<div class="a tengah orang" style="left:${x}px;top:${y}px;width:260px;flex-direction:column;gap:10px">${av(h, WARNA[h], 110)}<div style="font-size:32px;font-weight:700">${n}</div><div class="pil biru" style="font-size:26px;padding:8px 18px">Ingat alasannya?</div></div>`).join("")}
        <svg class="a" style="left:0;top:0" width="1920" height="700" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="12 12"><path d="M820 320 L580 170"/><path d="M820 400 L580 540"/><path d="M1100 350 L1410 350"/></svg>
      </div>`;
    tl.set("#tiga, .isi, #andi, #tanyaAndi, #kutip, #tak, #tanya3, .orang", { autoAlpha: 0 }, 0);
    muncul("#hp", .1, { y: 30 });
    muncul("#andi", c(1), { y: 30 });
    muncul("#tanyaAndi", p(1, .45), { y: 20 });
    hilang("#toko", c(2) - .25);
    tl.to("#tiga", { autoAlpha: 1, duration: .01 }, c(2) - .05);
    muncul("#k1, #k2, #k3", c(2), { st: .2, y: 40 });
    tl.to("#k1 .isi", { autoAlpha: 1, duration: .4 }, c(3));
    tl.to("#k2 .isi", { autoAlpha: 1, duration: .4 }, c(4));
    tl.to("#k3 .isi", { autoAlpha: 1, duration: .4 }, c(5));
    hilang("#tiga", c(6) - .25);
    muncul("#kutip", p(6, .1), { y: 30 });
    muncul("#tak", p(6, .65), { s: 1.3, ease: "back.out(2)" });
    hilang("#kutip", c(7) - .25);
    tl.to("#tanya3", { autoAlpha: 1, duration: .3 }, c(7));
    muncul(".orang", c(7), { st: .25 });
    return tl;
  },
  solusi(k) {
    const { c, p, tl, muncul, hilang } = alat(k);
    $("#isi").innerHTML = `
      <div class="a tengah" id="logo" style="left:0;top:130px;width:1920px;flex-direction:column;gap:30px">
        <div style="font-size:170px;font-weight:800;line-height:1">Run<span style="color:var(--kuning)">ut</span></div>
        <div style="font-size:64px;font-weight:800">Asisten riwayat proyek untuk karyawan</div>
        <div style="font-size:42px;line-height:1.35;max-width:1400px;text-align:center">Menyusun jawaban dari obrolan, dokumen, dan tugas, hanya dari data yang boleh dilihat si penanya</div>
        <div style="font-size:30px;color:var(--redup)">Tantangan The Workplace Brain &nbsp;·&nbsp; Dibangun di WorkBuddy</div>
      </div>
      <div class="a tengah" id="beda" style="left:0;top:250px;width:1920px;flex-direction:column;gap:50px">
        <div style="font-size:60px;font-weight:800">Dipakai dengan tanya jawab. Bedanya ada dua.</div>
        <div style="display:flex;gap:50px"><span class="pil kuning" style="font-size:46px;padding:22px 44px">Isi jawabannya</span><span class="pil hijau" style="font-size:46px;padding:22px 44px">Cara menjaga datanya</span></div>
      </div>
      <div class="a" id="satu" style="left:90px;top:130px;width:560px"><div class="kecil" style="font-size:30px;margin-bottom:10px">Satu pertanyaan</div><div class="gel" style="font-size:38px;font-weight:700;background:var(--biru);color:#0e1626">Kenapa stok di Makassar terlambat, dan apa yang belum selesai?</div></div>
      <div class="a kartu jawab" id="j1" style="left:720px;top:110px;width:1110px"><h4>1. Kronologi</h4>
        <p>6 Okt, kapal tanggal 5 belum berangkat, slot penuh <span class="id">[ops-sulawesi/002]</span></p>
        <p>8 Okt, pesanan direvisi jadi 900 karton <span class="id">[doc/po-2291-v2]</span></p>
        <p>12 Okt, 900 karton tiba di gudang Makassar <span class="id">[ops-sulawesi/005]</span></p></div>
      <div class="a kartu jawab" id="j2" style="left:720px;top:375px;width:1110px"><h4>2. Yang belum selesai</h4>
        <p>Jadwal kapal 300 karton sisanya, Rina Wulandari, tenggat 28 Okt <span class="id">[T-101]</span></p>
        <p>Revisi aturan waktu kirim, Dedi Pratama, tenggat 7 Nov <span class="id">[T-102]</span></p></div>
      <div class="a kartu jawab" id="j3" style="left:720px;top:595px;width:1110px;border-color:var(--kuning);box-shadow:0 0 34px rgba(247,183,51,.28)"><h4 style="color:var(--kuning)">3. Celah catatan</h4>
        <p>Alasan revisi pesanan tidak tertulis. Yang kemungkinan tahu, Dedi Pratama <span class="id">[ops-sulawesi/004]</span></p></div>`;
    tl.set("#beda, #satu, #j1, #j2, #j3", { autoAlpha: 0 }, 0);
    muncul("#logo", 0.1, { s: .92 });
    hilang("#logo", c(1) - .25);
    muncul("#beda", c(1), { y: 24 });
    hilang("#beda", c(2) - .25);
    muncul("#satu", c(2), { x: -40, y: 0 });
    muncul("#j1", p(2, .45), { x: 40, y: 0 });
    muncul("#j2", c(3), { x: 40, y: 0 });
    muncul("#j3", c(4), { x: 40, y: 0 });
    return tl;
  },
  arsitektur(k) {
    const { c, p, tl, muncul, hilang } = alat(k);
    const kotak = (id, x, y, w, h, isi, gaya = "") => `<div class="a kartu tengah" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;flex-direction:column;gap:12px;padding:16px;${gaya}">${isi}</div>`;
    const nomor = (n, warna) => `<div style="width:64px;height:64px;border-radius:50%;background:${warna};color:#0e1626;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800">${n}</div>`;
    $("#isi").innerHTML = `
      <div id="alur" class="a" style="inset:0">
      <div class="a" id="sumberA" style="left:70px;top:210px;width:340px">
        <div class="kecil" style="margin-bottom:14px;font-size:28px">Yang sudah ada</div>
        <div class="pil biru s1" style="display:block;margin-bottom:16px;text-align:center">Obrolan WhatsApp</div>
        <div class="pil biru s1" style="display:block;margin-bottom:16px;text-align:center">Dokumen</div>
        <div class="pil biru s1" style="display:block;text-align:center">Daftar tugas</div>
      </div>
      ${kotak("izin", 470, 180, 430, 400, `${nomor(1, "var(--biru)")}<div style="font-size:40px;font-weight:800">Tabel izin</div><div style="font-size:30px;line-height:1.35;text-align:center">Siapa boleh melihat apa</div>`)}
      ${kotak("gerbang", 950, 180, 430, 400, `${nomor(2, "var(--kuning)")}<div style="font-size:40px;font-weight:800;color:var(--kuning)">Saring dulu</div><div style="font-size:30px;line-height:1.35;text-align:center">Baru dicari, baru AI menulis</div>`, "border-color:var(--kuning);border-width:3px")}
      ${kotak("periksa", 1430, 180, 430, 400, `${nomor(3, "var(--hijau)")}<div style="font-size:40px;font-weight:800;color:var(--hijau)">Diperiksa kode</div><div style="font-size:30px;line-height:1.35;text-align:center">Angka, tanggal, nama, sumber</div>`, "border-color:var(--hijau)")}
      <div class="a tengah" id="pesan" style="left:0;top:660px;width:1920px;font-size:50px;font-weight:800;color:var(--kuning)">AI tidak bisa membocorkan data yang tidak pernah ia lihat</div>
      </div>
      <div class="a kartu" id="tim" style="left:90px;top:190px;width:840px;height:600px">
        <div style="font-size:48px;font-weight:800;margin-bottom:8px">Tim empat agen</div>
        <div class="kecil" style="font-size:32px;margin-bottom:30px">Penelusuran teliti, beberapa menit</div>
        ${[["Tata", "pemimpin"], ["Lusi", "pencari sumber"], ["Yusuf", "penulis kronologi"], ["Riksa", "pemeriksa, terpisah dari penulis"]].map(([n, r]) => `<div style="display:flex;gap:18px;align-items:baseline;margin-bottom:20px"><span style="font-size:36px;font-weight:800;color:var(--kuning);width:130px">${n}</span><span style="font-size:32px">${r}</span></div>`).join("")}
      </div>
      <div class="a kartu" id="cepat" style="left:990px;top:190px;width:840px;height:600px;border-color:var(--hijau)">
        <div style="font-size:48px;font-weight:800;margin-bottom:8px">Runut Cepat</div>
        <div class="kecil" style="font-size:32px;margin-bottom:50px">Satu agen, filter dan pemeriksa yang sama</div>
        <div style="font-size:112px;font-weight:800;color:var(--hijau);line-height:1">&lt; 90 detik</div>
      </div>`;
    tl.set("#izin, #gerbang, #periksa, #pesan, #tim, #cepat", { autoAlpha: 0 }, 0);
    muncul("#sumberA .s1", 0.2, { st: .3, x: -30, y: 0 });
    muncul("#izin", c(1), { s: .92 });
    muncul("#gerbang", c(2), { s: .92 });
    muncul("#pesan", p(2, .4), { y: 20 });
    muncul("#periksa", c(3), { s: .92 });
    hilang("#alur", c(4) - .25);
    muncul("#tim", c(4), { x: -40, y: 0 });
    muncul("#cepat", p(4, .4), { x: 40, y: 0 });
    return tl;
  },
  tingkat(k) {
    const { c, tl, muncul } = alat(k);
    const kol = (id, x, huruf, warna, nama, isi, gaya = "") => `<div class="a kartu" id="${id}" style="left:${x}px;top:270px;width:570px;height:460px;${gaya}">
      <div class="baris" style="align-items:center;margin-bottom:24px">${av(huruf, warna, 76)}<div style="font-size:38px;font-weight:800">${nama}</div></div>${isi}</div>`;
    $("#isi").innerHTML = `
      <div class="a" id="tanya" style="left:70px;top:100px;width:1780px"><span class="tag biru">Hasil pencarian asli, sebelum AI menulis</span><div style="font-size:54px;font-weight:800;margin-top:12px">Kenapa WMS ditunda? <span style="font-size:32px;font-weight:600;color:var(--redup)">WMS adalah sistem gudang</span></div></div>
      ${kol("kA", 70, "A", WARNA.A, "Staf", `<div class="gel" style="color:var(--redup);font-size:34px">Tidak ada data yang cocok.</div>`)}

// Dipanggil dari render.mjs
window.MUAT = async (a) => {
  adegan = a;
  $("#merek").style.display = "";
  $("#bab").textContent = a.bab || "";
  $("#teks").textContent = "";
  const buat = ADEGAN[a.id] ?? ((k) => window.ADEGAN_REKAMAN(a, k, alat(k)));
  garis = buat(a.kalimat);
  await document.fonts.ready;
  const img = [...document.images];
  await Promise.all(img.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  if (window.SIAPKAN_VIDEO) await window.SIAPKAN_VIDEO();
  return a.durasi;
};
window.LIHAT = async (t) => {
  garis.time(t, false);
  const k = adegan.kalimat.find((x) => t >= x.mulai - .05 && t <= x.selesai + .12);
  const s = k ? k.en : "";
  const el = $("#teks");
  if (el.textContent !== s) el.textContent = s;
  // Tabir: masuk dari gelap dan keluar ke gelap.
  const d = adegan.durasi;
  $("#tabir").style.opacity = Math.max(0, Math.min(1, Math.max(adegan.id === "hook" ? 0 : 1 - t / .3, (t - (d - .28)) / .28)));
  if (window.SEEK_VIDEO) await window.SEEK_VIDEO(t);
};
</script>
