<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Adegan video Runut</title>
<style>
@font-face { font-family: "Jakarta"; font-weight: 400; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2"); }
@font-face { font-family: "Jakarta"; font-weight: 600; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2"); }
@font-face { font-family: "Jakarta"; font-weight: 800; src: url("node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2"); }
@font-face { font-family: "Mono"; font-weight: 400; src: url("node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2"); }
:root { --latar: #0e1626; --kartu: #18243b; --kartu2: #21304c; --garis: #33456a; --teks: #f3f6fb; --redup: #9fb0cc; --kuning: #f7b733; --hijau: #34d399; --merah: #f87171; --biru: #60a5fa; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--latar); color: var(--teks); font-family: "Jakarta", "Segoe UI", sans-serif; }
#panggung { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 75% 15%, #1b2c4d 0%, transparent 70%), var(--latar); }
#isi { position: absolute; inset: 0; }
#bab { position: absolute; left: 60px; top: 44px; font-size: 26px; font-weight: 600; color: var(--kuning); letter-spacing: .5px; }
#merek { position: absolute; right: 60px; top: 40px; font-size: 30px; font-weight: 800; color: var(--teks); opacity: .85; }
#merek b { color: var(--kuning); }
#teks { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: 1640px; width: max-content; text-align: center; font-size: 33px; line-height: 1.3; font-weight: 600; background: rgba(6, 10, 20, .86); padding: 12px 28px; border-radius: 12px; }
#teks:empty { display: none; }
#tabir { position: absolute; inset: 0; background: #060a14; pointer-events: none; }
.a { position: absolute; }
.kartu { background: var(--kartu); border: 1.5px solid var(--garis); border-radius: 20px; padding: 26px 30px; }
.judul { font-size: 30px; font-weight: 800; }
.kecil { font-size: 24px; color: var(--redup); }
.id { font-family: "Mono", monospace; color: var(--biru); font-size: .86em; }
.av { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 32px; color: #0e1626; flex: none; }
.gel { background: var(--kartu2); border-radius: 18px; padding: 16px 22px; font-size: 27px; line-height: 1.35; }
.nama { font-size: 22px; font-weight: 700; color: var(--hijau); margin-bottom: 4px; }
.baris { display: flex; gap: 16px; align-items: flex-start; }
.pil { display: inline-block; padding: 12px 24px; border-radius: 999px; font-size: 30px; font-weight: 700; }
.merah { background: rgba(248, 113, 113, .16); border: 2px solid var(--merah); color: #fecaca; }
.hijau { background: rgba(52, 211, 153, .14); border: 2px solid var(--hijau); color: #bbf7d0; }
.kuning { background: rgba(247, 183, 51, .14); border: 2px solid var(--kuning); color: #fde9b5; }
.biru { background: rgba(96, 165, 250, .14); border: 2px solid var(--biru); color: #cfe3ff; }
.besar { font-size: 76px; font-weight: 800; line-height: 1.12; }
.sumber { font-size: 21px; color: var(--redup); }
.tengah { display: flex; align-items: center; justify-content: center; text-align: center; }
.jawab h4 { font-size: 27px; font-weight: 800; margin-bottom: 8px; }
.jawab p { font-size: 25px; line-height: 1.38; color: #dbe4f3; margin-bottom: 5px; }
table.izin { border-collapse: collapse; font-size: 22px; width: 100%; }
table.izin td { border: 1px solid var(--garis); padding: 7px 10px; font-family: "Mono", monospace; font-size: 20px; }
.token { position: absolute; width: 44px; height: 44px; border-radius: 10px; }
.tag { display: inline-block; font-size: 22px; font-weight: 700; padding: 7px 16px; border-radius: 999px; }
.batang { height: 44px; border-radius: 10px; }
#log { position: absolute; }
video { position: absolute; background: #000; }
</style>
</head>
<body>
<div id="panggung">
  <div id="isi"></div>
  <div id="bab"></div>
  <div id="merek">Run<b>ut</b></div>
  <div id="teks"></div>
  <div id="tabir"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="rekaman.js"></script>
<script>
// Satu adegan dimuat sekali, lalu LIHAT(t) menaruh semua animasi tepat pada detik t. Tidak ada jam berjalan, jadi hasil render selalu sama.
let garis = null, adegan = null;
const $ = (s) => document.querySelector(s);
const av = (huruf, warna, ukuran = 76) => `<div class="av" style="background:${warna};width:${ukuran}px;height:${ukuran}px;font-size:${ukuran * .42}px">${huruf}</div>`;
const WARNA = { A: "#60a5fa", D: "#f7b733", R: "#34d399", S: "#c084fc", H: "#f87171", T: "#f472b6" };

function alat(k) {
  const c = (i, geser = 0) => k[i].mulai + geser * (k[i].skala ?? 1);
  const tl = gsap.timeline({ paused: true });
  const muncul = (s, at, v = {}) => tl.fromTo(s, { autoAlpha: 0, y: v.y ?? 28, x: v.x ?? 0, scale: v.s ?? 1 }, { autoAlpha: 1, y: 0, x: 0, scale: 1, duration: v.d ?? .6, ease: v.ease ?? "power3.out", stagger: v.st ?? 0 }, at);
  const hilang = (s, at, d = .4) => tl.to(s, { autoAlpha: 0, duration: d, ease: "power1.in" }, at);
  const redup = (s, at, o = .25) => tl.to(s, { opacity: o, duration: .4 }, at);
  const hitung = (s, dari, ke, at, d, f = (n) => Math.round(n)) => {
    const o = { n: dari };
    tl.to(o, { n: ke, duration: d, ease: "power2.out", onUpdate: () => { $(s).textContent = f(o.n); } }, at);
  };
  return { c, tl, muncul, hilang, redup, hitung };
}

const ADEGAN = {
  hook(k) {
    const { c, tl, muncul, hilang } = alat(k);
    $("#isi").innerHTML = `
      <div class="a kartu" id="hp" style="left:150px;top:270px;width:820px">
        <div class="kecil" style="margin-bottom:18px">Grup WhatsApp ops-sulawesi</div>
        <div class="baris" id="g1" style="margin-bottom:22px">${av("R", WARNA.R)}<div class="gel"><div class="nama">Rina Wulandari</div>Toko-toko di Makassar mulai tanya stok keripik. Ada ETA baru?</div></div>
        <div class="baris" id="g2">${av("A", WARNA.A)}<div class="gel"><div class="nama" style="color:${WARNA.A}">Andi Saputra</div>Yang 300 karton kapan sampai?</div></div>
      </div>
      <div class="a tengah" id="andi" style="left:1150px;top:280px;width:620px;flex-direction:column;gap:24px">
        ${av("A", WARNA.A, 170)}
        <div style="font-size:44px;font-weight:800">Andi Saputra</div>
        <div class="kecil" style="font-size:30px">Staf sales, harus menjawab hari ini</div>
      </div>
      <div class="a tengah besar" id="tanya" style="left:160px;top:300px;width:1600px">Kenapa stok telat, dan apa yang masih open?</div>
      <div class="a tengah" id="pecah" style="left:0;top:620px;width:1920px;gap:40px">
        <span class="pil biru">Grup chat</span><span class="pil biru">Dokumen revisi</span><span class="pil biru">Task board</span><span class="pil kuning">Ingatan orang</span>
      </div>`;
    muncul("#g1", 0.2);
    muncul("#g2", c(0, 1.2));
    muncul("#andi", c(1), { y: 40 });
    hilang("#hp, #andi", c(1, 1.9));
    muncul("#tanya", c(1, 2.1), { s: .94 });
    muncul("#pecah .pil", c(2), { st: .16, y: 40 });
    return tl;
  },
  masalah(k) {
    const { c, tl, muncul, hilang, hitung } = alat(k);
    $("#isi").innerHTML = `
      <div class="a kartu" id="k1" style="left:70px;top:110px;width:570px;height:500px">
        <div class="judul" style="margin-bottom:14px">Grup WhatsApp</div>
        <div class="gel" style="font-size:23px;margin-bottom:12px"><div class="nama">Dedi</div>Kapal tanggal 5 belum berangkat, slot penuh.</div>
        <div class="gel" style="font-size:23px;margin-bottom:12px"><div class="nama">Rina</div>900 karton sudah tiba di gudang Makassar.</div>
        <div class="gel" style="font-size:23px"><div class="nama">Sari</div>Lead time kita hitung 7 hari, bukan 5.</div>
      </div>
      <div class="a kartu" id="k2" style="left:675px;top:110px;width:570px;height:500px">
        <div class="judul" style="margin-bottom:14px">Dokumen revisi</div>
        <div class="kecil" style="margin-bottom:8px">PO-2291 versi 1</div>
        <div style="font-size:25px;line-height:1.4;margin-bottom:16px;text-decoration:line-through;color:var(--redup)">1.200 karton, kapal 5 Okt, ETA 10 Okt</div>
        <div class="kecil" style="margin-bottom:8px">PO-2291 versi 2</div>
        <div style="font-size:25px;line-height:1.4;margin-bottom:12px">900 karton, kapal 9 Okt, ETA 12 Okt</div>
        <div style="font-size:27px;font-weight:700;color:var(--kuning)" id="kosong">Alasan revisi, kosong</div>
      </div>
      <div class="a kartu" id="k3" style="left:1280px;top:110px;width:570px;height:500px">
        <div class="judul" style="margin-bottom:14px">Task board</div>
        <div class="gel" style="font-size:23px;margin-bottom:12px">Konfirmasi jadwal kapal susulan 300 karton. Open, Rina.</div>
        <div class="gel" style="font-size:23px">Revisi SOP lead time, 5 ke 7 hari. Open, Dedi.</div>
      </div>
      <div class="a baris" id="kutip" style="left:300px;top:640px;width:1320px;align-items:center">${av("D", WARNA.D, 110)}<div class="gel kuning" style="font-size:44px;font-weight:700;padding:22px 38px">Alasannya nanti aku jelasin di call ya.</div></div>
      <div class="a pil merah" id="tak" style="left:1250px;top:800px;font-size:34px">Tidak pernah dicatat</div>
      <div class="a" id="tanya3" style="left:0;top:150px;width:1920px;height:700px">
        <div class="a tengah" style="left:810px;top:270px;width:300px;flex-direction:column;gap:12px">${av("A", WARNA.A, 130)}<div style="font-size:32px;font-weight:800">Andi</div></div>
        ${[["D", "Dedi", 300, 60], ["R", "Rina", 300, 470], ["S", "Sari", 1420, 260]].map(([h, n, x, y]) => `<div class="a tengah orang" style="left:${x}px;top:${y}px;width:220px;flex-direction:column;gap:10px">${av(h, WARNA[h], 110)}<div style="font-size:28px;font-weight:700">${n}</div><div class="pil biru" style="font-size:22px;padding:6px 16px">Ingat alasannya?</div></div>`).join("")}
        <svg class="a" style="left:0;top:0" width="1920" height="700" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="12 12"><path d="M820 320 L560 170"/><path d="M820 400 L560 540"/><path d="M1100 350 L1410 350"/></svg>
      </div>
      <div class="a tengah" id="stat" style="left:0;top:170px;width:1920px;flex-direction:column;gap:28px">
        <div style="font-size:190px;font-weight:800;color:var(--kuning);line-height:1"><span>&gt;</span> <span id="angka">0</span>%</div>
        <div style="font-size:46px;font-weight:600;max-width:1300px">minggu kerja tim habis untuk mencari informasi</div>
        <div style="width:1100px;height:34px;background:var(--kartu2);border-radius:999px;overflow:hidden"><div id="isiBatang" style="height:100%;width:0;background:var(--kuning)"></div></div>
        <div class="sumber">Sumber Atlassian State of Teams 2025</div>
      </div>`;
    muncul("#k1", 0.1, { y: 50 });
    muncul("#k2", c(1), { y: 50 });
    muncul("#k3", c(2), { y: 50 });
    muncul("#kutip", c(3), { y: 40 });
    muncul("#tak", c(4), { s: 1.4, ease: "back.out(2)" });
    hilang("#k1, #k2, #k3, #kutip, #tak", c(4, 2.1));
    muncul("#tanya3", c(4, 2.3), { y: 0 });
    muncul(".orang", c(4, 2.4), { st: .22 });
    hilang("#tanya3", c(5) - .25);
    muncul("#stat", c(5), { y: 20 });
    hitung("#angka", 0, 25, c(5, .2), 1.5);
    tl.to("#isiBatang", { width: "25%", duration: 1.5, ease: "power2.out" }, c(5, .2));
    return tl;
  },
  bocor(k) {
    const { c, tl, muncul, hilang } = alat(k);
    const dok = [["Chat tim", 260, 220, "biru"], ["SOP", 260, 400, "biru"], ["Task board", 260, 580, "biru"], ["Kanal manajemen", 1290, 220, "merah"], ["Daftar gaji", 1290, 400, "merah"], ["Kanal direksi", 1290, 580, "merah"]];
    $("#isi").innerHTML = `
      <div class="a tengah" id="bot" style="left:760px;top:280px;width:400px;height:300px;flex-direction:column;gap:18px">
        <div style="width:190px;height:190px;border-radius:40px;background:var(--kartu2);border:3px solid var(--biru);display:flex;align-items:center;justify-content:center;gap:34px"><span style="width:30px;height:30px;border-radius:50%;background:var(--biru)"></span><span style="width:30px;height:30px;border-radius:50%;background:var(--biru)"></span></div>
        <div style="font-size:34px;font-weight:800">Chatbot yang membaca semuanya</div>
      </div>
      ${dok.map(([t, x, y, w]) => `<div class="a pil ${w} dok" style="left:${x}px;top:${y}px;font-size:28px">${t}</div>`).join("")}
      <div class="a tengah" id="bocorPil" style="left:60px;top:680px;width:1800px;gap:30px">
        <span class="pil merah">Pembayaran Rp85 juta ditahan</span><span class="pil merah">Gaji rekan kerja</span><span class="pil merah">Rencana akuisisi direksi</span>
      </div>
      <div class="a kartu tengah" id="pp" style="left:360px;top:230px;width:1200px;height:420px;flex-direction:column;gap:24px">
        <div style="font-size:72px;font-weight:800;color:var(--kuning)">PP 33/2026</div>
        <div style="font-size:40px;font-weight:600;line-height:1.3">AI disebut sebagai contoh pemicu penilaian dampak data pribadi</div>
        <div class="kecil" style="font-size:30px">Berlaku 16 Januari 2027</div>
      </div>`;
    muncul("#bot", 0.1, { s: .8, ease: "back.out(1.6)" });
    muncul(".dok", 0.4, { st: .08 });
    tl.to(".dok", { left: 880, top: 400, scale: .3, opacity: 0, duration: .8, ease: "power2.in", stagger: .06 }, c(1));
    muncul("#bocorPil .pil", c(1, 3.2), { st: 1.3, y: 30, ease: "back.out(1.6)" });
    hilang("#bot, #bocorPil", c(2) - .25);
    muncul("#pp", c(2), { s: .95 });
    return tl;
  },
  solusi(k) {
    const { c, tl, muncul, hilang } = alat(k);
    $("#isi").innerHTML = `
      <div class="a tengah" id="logo" style="left:0;top:210px;width:1920px;flex-direction:column;gap:30px">
        <div style="font-size:190px;font-weight:800;line-height:1">Run<span style="color:var(--kuning)">ut</span></div>
        <div style="font-size:40px;color:var(--redup)">Challenge A, Workplace Brain. Dibangun di WorkBuddy.</div>
      </div>
      <div class="a" id="satu" style="left:90px;top:120px;width:560px"><div class="kecil" style="font-size:30px;margin-bottom:10px">Satu pertanyaan</div><div class="gel" style="font-size:36px;font-weight:700;background:var(--biru);color:#0e1626">Kenapa stok di Makassar telat, dan apa yang masih open?</div></div>
      <div class="a kartu jawab" id="j1" style="left:720px;top:110px;width:1110px"><h4>Kronologi</h4>
        <p>6 Okt, kapal tanggal 5 belum berangkat, slot penuh <span class="id">[ops-sulawesi/002]</span></p>
        <p>8 Okt, PO-2291 direvisi jadi 900 karton <span class="id">[doc/po-2291-v2]</span></p>
        <p>12 Okt, 900 karton tiba di gudang Makassar <span class="id">[ops-sulawesi/005]</span></p></div>
      <div class="a kartu jawab" id="j2" style="left:720px;top:375px;width:1110px"><h4>Yang masih open</h4>
        <p>Konfirmasi kapal susulan, Rina Wulandari, tenggat 2026-10-28 <span class="id">[T-101]</span></p>
        <p>Revisi SOP lead time, Dedi Pratama, tenggat 2026-11-07 <span class="id">[T-102]</span></p></div>
      <div class="a kartu jawab" id="j3" style="left:720px;top:595px;width:1110px;border-color:var(--kuning);box-shadow:0 0 34px rgba(247,183,51,.28)"><h4 style="color:var(--kuning)">Celah catatan</h4>
        <p>Alasan revisi PO-2291 tidak tertulis. Yang kemungkinan tahu, Dedi Pratama <span class="id">[ops-sulawesi/004]</span></p></div>
      <div class="a pil hijau" id="batas" style="left:90px;top:620px;width:560px;font-size:32px;border-radius:22px;text-align:center;line-height:1.3">Hanya dari data yang boleh dilihat penanya</div>`;
    muncul("#logo", 0.1, { s: .92 });
    hilang("#logo", c(1) - .3);
    muncul("#satu", c(1), { x: -40, y: 0 });
    muncul("#j1", c(1, 1.7), { x: 40, y: 0 });
    muncul("#j2", c(2), { x: 40, y: 0 });
    muncul("#j3", c(3), { x: 40, y: 0 });
    muncul("#batas", c(4), { y: 30, ease: "back.out(1.5)" });
    return tl;
  },
  arsitektur(k) {
    const { c, tl, muncul, hilang } = alat(k);
    const kotak = (id, x, y, w, h, isi, gaya = "") => `<div class="a kartu tengah" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;flex-direction:column;gap:8px;padding:14px;${gaya}">${isi}</div>`;
    $("#isi").innerHTML = `
      <div id="alur" class="a" style="inset:0">
      <div class="a" id="sumberA" style="left:60px;top:190px;width:290px">
        <div class="kecil" style="margin-bottom:12px">Yang sudah dimiliki perusahaan</div>
        <div class="pil biru s1" style="display:block;margin-bottom:14px;font-size:26px">Grup WhatsApp</div>
        <div class="pil biru s1" style="display:block;margin-bottom:14px;font-size:26px">Dokumen</div>
        <div class="pil biru s1" style="display:block;font-size:26px">Task board</div>
      </div>
      <div class="a kartu" id="izin" style="left:390px;top:190px;width:370px;padding:18px">
        <div style="font-size:27px;font-weight:800;margin-bottom:10px">Tabel izin</div>
        <table class="izin"><tr><td>ops-sulawesi</td><td>staf</td></tr><tr><td>mgmt-vendor</td><td>manajer</td></tr><tr><td>direksi</td><td>direksi</td></tr></table>
        <div class="kecil" style="margin-top:10px;font-size:22px">Tidak tercantum berarti tertutup</div>
      </div>
      ${kotak("gerbang", 810, 170, 210, 330, `<div style="font-size:30px;font-weight:800;color:var(--kuning);line-height:1.2">Filter izin</div><div class="kecil" style="font-size:22px">di kode, sebelum pencarian</div>`, "border-color:var(--kuning);border-width:3px")}
      <div class="a tengah" id="andiI" style="left:795px;top:60px;width:240px;gap:12px">${av("A", WARNA.A, 62)}<div style="font-size:24px;font-weight:700;text-align:left">Identitas<br>Andi, staf</div></div>
      ${kotak("model", 1080, 190, 220, 290, `<div style="font-size:32px;font-weight:800">Model</div><div class="kecil" style="font-size:22px">menulis hanya dari yang lolos filter</div>`)}
      ${kotak("periksa", 1345, 190, 220, 290, `<div style="font-size:30px;font-weight:800;color:var(--hijau)">Pemeriksa</div><div class="kecil" style="font-size:22px">angka, tanggal, orang, sumber, oleh kode</div>`, "border-color:var(--hijau)")}
      ${kotak("hasil", 1610, 190, 250, 290, `<div style="font-size:32px;font-weight:800">Jawaban</div><div class="kecil" style="font-size:22px">hanya yang lolos boleh ditampilkan</div>`)}
      <div class="token" id="t1" style="left:760px;top:425px;background:var(--hijau)"></div>
      <div class="token" id="t2" style="left:760px;top:205px;background:var(--merah)"></div>

// Dipanggil dari render.mjs
window.MUAT = async (a) => {
  adegan = a;
  $("#merek").style.display = "";
  $("#bab").textContent = a.bab || "";
  $("#teks").textContent = "";
  const buat = ADEGAN[a.id] ?? ((k) => window.ADEGAN_REKAMAN(a, k, alat(k)));
  garis = buat(a.kalimat);
  await document.fonts.ready;
  const img = [...document.images];
  await Promise.all(img.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  if (window.SIAPKAN_VIDEO) await window.SIAPKAN_VIDEO();
  return a.durasi;
};
window.LIHAT = async (t) => {
  garis.time(t, false);
  const k = adegan.kalimat.find((x) => t >= x.mulai - .05 && t <= x.selesai + .12);
  const s = k ? k.en : "";
  const el = $("#teks");
  if (el.textContent !== s) el.textContent = s;
  // Tabir: masuk dari gelap dan keluar ke gelap.
  const d = adegan.durasi;
  $("#tabir").style.opacity = Math.max(0, Math.min(1, Math.max(1 - t / .3, (t - (d - .28)) / .28)));
  if (window.SEEK_VIDEO) await window.SEEK_VIDEO(t);
};
