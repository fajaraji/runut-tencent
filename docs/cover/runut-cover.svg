<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 864" width="1520" height="864" role="img" aria-label="Runut cover: project history rebuilt from sources, within permissions">
  <title>Runut — Project history, within permissions</title>
  <desc>Cover image for the Tencent Cloud Hackathon Indonesia 2026 online showcase. Scattered chat, document and task sources pass through a permission gate before a three-part cited answer is produced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="20%" r="70%">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#060a14" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#51627f"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1520" height="864" fill="url(#bg)"/>
  <rect width="1520" height="864" fill="url(#glow)"/>

  <!-- LEFT: identity -->
  <rect x="100" y="96" width="18" height="18" rx="5" fill="#f7b733"/>
  <text x="134" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3" fill="#9fb0cc">TENCENT CLOUD HACKATHON 2026</text>

  <text x="96" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="172" font-weight="800" letter-spacing="-6" fill="#f3f6fb">RUNUT</text>
  <rect x="100" y="376" width="152" height="12" rx="6" fill="#f7b733"/>

  <text x="100" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="600" fill="#dbe4f3">Project history,</text>
  <text x="100" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="600" fill="#dbe4f3">within permissions.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="35" fill="#9fb0cc">
    <circle cx="110" cy="620" r="9" fill="#60a5fa"/>
    <text x="136" y="632">Every line cites a source</text>
    <circle cx="110" cy="674" r="9" fill="#34d399"/>
    <text x="136" y="686">Only what you may see</text>
    <circle cx="110" cy="728" r="9" fill="#f7b733"/>
    <text x="136" y="740">Every call is logged</text>
  </g>
  <text x="100" y="806" font-family="Segoe UI, Arial, sans-serif" font-size="27" letter-spacing="1" fill="#51627f">WORKBUDDY  ·  EXPERT TEAMS + MCP</text>

  <!-- RIGHT: diagram panel -->
  <rect x="790" y="96" width="640" height="672" rx="32" fill="#0e1626" stroke="#21304c" stroke-width="2"/>
  <text x="830" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#f7b733">FILTER BEFORE SEARCH</text>
  <text x="1150" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#f7b733">TRUST BOUNDARY</text>

  <!-- source cards -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#dbe4f3" letter-spacing="1">
    <!-- chat -->
    <rect x="830" y="214" width="252" height="100" rx="18" fill="#18243b" stroke="#33456a" stroke-width="2"/>
    <rect x="852" y="240" width="46" height="34" rx="10" fill="none" stroke="#f7b733" stroke-width="4"/>
    <path d="M862 274 L858 288 L874 274" fill="#f7b733"/>
    <text x="912" y="256">CHAT</text>
    <rect x="912" y="272" width="140" height="9" rx="4" fill="#33456a"/>
    <rect x="912" y="288" width="102" height="9" rx="4" fill="#33456a"/>
    <!-- docs -->
    <rect x="830" y="336" width="252" height="100" rx="18" fill="#18243b" stroke="#33456a" stroke-width="2"/>
    <path d="M852 362 H880 L892 374 V402 H852 Z" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round"/>
    <path d="M880 362 V374 H892" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <text x="912" y="378">DOCS</text>
    <rect x="912" y="394" width="140" height="9" rx="4" fill="#33456a"/>
    <rect x="912" y="410" width="102" height="9" rx="4" fill="#33456a"/>
    <!-- tasks -->
    <rect x="830" y="458" width="252" height="100" rx="18" fill="#18243b" stroke="#33456a" stroke-width="2"/>
    <rect x="852" y="484" width="40" height="40" rx="8" fill="none" stroke="#34d399" stroke-width="4"/>
    <path d="M860 504 L869 513 L885 494" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="500">TASKS</text>
    <rect x="912" y="516" width="140" height="9" rx="4" fill="#33456a"/>
    <rect x="912" y="532" width="102" height="9" rx="4" fill="#33456a"/>
  </g>

  <!-- arrows into the gate -->
  <g stroke="#51627f" stroke-width="3" marker-end="url(#ar)" fill="none">
    <path d="M1086 264 H1130"/>
    <path d="M1086 386 H1130"/>
    <path d="M1086 508 H1130"/>
  </g>

  <!-- permission gate -->
  <path d="M1150 214 V648" stroke="#f7b733" stroke-width="3" stroke-dasharray="10 12" opacity="0.85"/>
  <circle cx="1150" cy="430" r="54" fill="#060a14" stroke="#f7b733" stroke-width="6"/>
  <path d="M1136 432 V416 A14 14 0 0 1 1164 416 V432" fill="none" stroke="#f7b733" stroke-width="5" stroke-linecap="round"/>
  <rect x="1132" y="430" width="36" height="30" rx="6" fill="none" stroke="#f7b733" stroke-width="5"/>
  <circle cx="1150" cy="444" r="4" fill="#f7b733"/>

  <path d="M1180 430 H1196" stroke="#34d399" stroke-width="3" marker-end="url(#arGreen)" fill="none"/>

  <!-- cited answer card -->
  <rect x="1204" y="252" width="196" height="356" rx="20" fill="#18243b" stroke="#60a5fa" stroke-width="3"/>
  <text x="1224" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#60a5fa">CITED ANSWER</text>
  <circle cx="1400" cy="252" r="18" fill="#34d399" stroke="#0e1626" stroke-width="3"/>
  <path d="M1392 252 L1398 258 L1409 245" fill="none" stroke="#060a14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="1224" y="318" width="14" height="14" rx="4" fill="#f7b733"/>
    <rect x="1248" y="320" width="126" height="10" rx="5" fill="#51627f"/>
    <rect x="1248" y="338" width="88" height="10" rx="5" fill="#33456a"/>
    <rect x="1224" y="358" width="34" height="14" rx="5" fill="#1b3a6b"/>

    <rect x="1224" y="408" width="14" height="14" rx="4" fill="#60a5fa"/>
    <rect x="1248" y="410" width="126" height="10" rx="5" fill="#51627f"/>
    <rect x="1248" y="428" width="96" height="10" rx="5" fill="#33456a"/>
    <rect x="1224" y="448" width="34" height="14" rx="5" fill="#1b3a6b"/>

    <rect x="1224" y="498" width="14" height="14" rx="4" fill="#34d399"/>
    <rect x="1248" y="500" width="126" height="10" rx="5" fill="#51627f"/>
    <rect x="1248" y="518" width="80" height="10" rx="5" fill="#33456a"/>
    <rect x="1224" y="538" width="34" height="14" rx="5" fill="#1b3a6b"/>
  </g>
  <path d="M1224 578 H1380" stroke="#33456a" stroke-width="2"/>
  <text x="1224" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9fb0cc">1 ASK → 3 PARTS</text>

  <!-- audit strip -->
  <g fill="#18243b" stroke="#33456a" stroke-width="2">
    <rect x="830" y="694" width="26" height="26" rx="5"/>
    <rect x="866" y="694" width="26" height="26" rx="5"/>
    <rect x="902" y="694" width="26" height="26" rx="5"/>
    <rect x="938" y="694" width="26" height="26" rx="5"/>
    <rect x="974" y="694" width="26" height="26" rx="5"/>
  </g>
  <g stroke="#51627f" stroke-width="3">
    <path d="M856 707 H866"/><path d="M892 707 H902"/><path d="M928 707 H938"/><path d="M964 707 H974"/>
  </g>
  <text x="1018" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#9fb0cc">HASH-CHAINED AUDIT LOG</text>
  <text x="830" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="19" letter-spacing="1" fill="#51627f">HIDDEN AND MISSING DATA GET THE SAME REPLY</text>
</svg>
